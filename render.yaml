services:
  - type: web
    name: guardmate
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: guardmate
      - key: GUARDMATE_SPEECH_TIMEOUT
        value: '90'
      - key: TINKER_API_KEY
        sync: false
      - key: GUARDMATE_ACCESS_USERNAME
        sync: false
      - key: GUARDMATE_ACCESS_PASSWORD
        sync: false
